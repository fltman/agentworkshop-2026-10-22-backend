<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>per: Metrics &amp; Comparison</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
  input, button { font: inherit; padding: .3rem .5rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #444; padding: .3rem .6rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .best { background: #14532d; }
  .user { color: #fbbf24; } .existing { color: #93c5fd; }
  #msg { margin-top: .5rem; color: #f87171; }
</style>
</head>
<body>
<h2>Metrics &amp; Comparison</h2>
<p>Enter run ids from the simulation engine (comma separated, at least two) to compare designs under identical demand.</p>
<input id="ids" size="40" placeholder="runId1, runId2">
<button id="go">Compare</button>
<p>Or compare junction types (signal / roundabout / priority) for one junction under identical demand:</p>
<select id="inter"></select>
<button id="types">Compare junction types</button>
<div id="msg"></div>
<div id="out"></div>
<script>
const ROWS = [
  ['Mean delay incl. unserved (s)', r => r.delay.meanSec, 'delay'],
  ['Delay, exited only (s)', r => r.delay.avgSec],
  ['Unserved share', r => (r.delay.unservedShare == null ? 'n/a' : r.delay.unservedShare)],
  ['P95 delay (s)', r => r.delay.p95Sec],
  ['Max queue (veh)', r => Math.max(0, ...Object.values(r.queue.maxByArm)), 'queue'],
  ['Throughput (veh)', r => r.throughput.vehicles, 'throughput'],
  ['Stopped vehicles', r => r.stopped.vehicles, 'stopped'],
  ['Avg stops / veh', r => r.stopped.avgStopsPerVeh],
  ['Ped avg wait (s)', r => r.pedestrians.avgWaitSec],
  ['CO2 (g)', r => r.emissions.co2G, 'emissions'],
  ['Demand vs measured', r => (r.calibration ? r.calibration.demandVsObserved : 'n/a')],
  ['Throughput vs measured', r => (r.calibration ? r.calibration.throughputVsObserved : 'n/a')],
];

function cell(text, cls) {
  const td = document.createElement('td');
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function render(data) {
  const out = document.getElementById('out');
  out.textContent = '';
  const t = document.createElement('table');
  const head = document.createElement('tr');
  head.appendChild(document.createElement('th'));
  for (const r of data.runs) {
    const th = document.createElement('th');
    const d = r.design || {};
    th.textContent = (r.junctionType ? r.junctionType + ': ' : '') + (d.name || d.id || r.runId) + ' ';
    const tag = document.createElement('small');
    tag.textContent = d.origin ? '(' + d.origin + ')' : '';
    tag.className = d.origin || '';
    th.appendChild(tag);
    head.appendChild(th);
  }
  t.appendChild(head);
  for (const [label, fn, key] of ROWS) {
    const tr = document.createElement('tr');
    tr.appendChild(cell(label));
    for (const r of data.runs) tr.appendChild(cell(fn(r), key && data.best[key] === r.runId ? 'best' : ''));
    t.appendChild(tr);
  }
  out.appendChild(t);
}

fetch('/t/per/realflows').then(r => r.json()).then(d => {
  const sel = document.getElementById('inter');
  for (const id of d.intersections || []) { const o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o); }
}).catch(() => {});

document.getElementById('types').onclick = async () => {
  const msg = document.getElementById('msg');
  msg.textContent = 'Running ...';
  try {
    const resp = await fetch('/t/per/compare-types', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ intersection: document.getElementById('inter').value }) });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.status);
    msg.textContent = 'Best by delay: ' + data.bestType.delay + ' (base: ' + data.baseType + ')';
    render(data);
  } catch (e) { msg.textContent = String(e.message || e); }
};

document.getElementById('go').onclick = async () => {
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const runIds = document.getElementById('ids').value.split(',').map(s => s.trim()).filter(Boolean);
  try {
    const resp = await fetch('/t/per/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ runIds }) });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.status);
    render(data);
  } catch (e) { msg.textContent = String(e.message || e); }
};
</script>
</body>
</html>
